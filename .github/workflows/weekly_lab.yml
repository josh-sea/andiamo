name: Weekly Quant Lab

on:
  schedule:
    - cron: "0 14 * * 6"   # Saturdays
  workflow_dispatch:

concurrency:
  group: andiamo-bot
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Model-written code runs in this job; keep the push token off disk until the commit step
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price store
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: price-store-${{ github.run_id }}
          restore-keys: price-store-

      - name: Run lab session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.main lab

      - name: Save price store
        if: always() && hashFiles('data/prices/close.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/
          key: price-store-${{ github.run_id }}

      - name: Commit notebook + site updates
        run: |
          git config user.name "andiamo-bot"
          git config user.email "andiamo-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add brain/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "lab: session [$(date -u +%Y-%m-%d)]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
