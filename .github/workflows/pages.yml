name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
  # Bot commits are pushed with GITHUB_TOKEN, which never triggers push events,
  # so deploy when a bot run finishes instead.
  workflow_run:
    workflows: ["Daily Finance Scan", "Daily Trading Session", "Weekly Quant Lab"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
